<template>
  <div class="slds-card">
    <!-- Loading State -->
    <template lwc:if={isLoading}>
      <div class="slds-align_absolute-center" style="height: 200px">
        <lightning-spinner
          alternative-text="Loading chart..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Error State -->
    <template lwc:elseif={hasError}>
      <div
        class="slds-align_absolute-center slds-text-color_error"
        style="height: 200px; padding: 1rem"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:error"
            alternative-text="Error"
            size="large"
            variant="error"
          ></lightning-icon>
          <p class="slds-m-top_small">{error}</p>
        </div>
      </div>
    </template>

    <!-- Chart Container (has data) -->
    <template lwc:elseif={hasData}>
      <div
        class="chart-container"
        lwc:dom="manual"
        style={containerStyle}
      ></div>

      <!-- Legend (rendered via LWC for accessibility) -->
      <template lwc:if={effectiveShowLegend}>
        <div
          class="legend-container slds-p-horizontal_medium slds-p-bottom_small"
        >
          <template for:each={legendItems} for:item="item">
            <span key={item.name} class="legend-item slds-m-right_medium">
              <span class="legend-color" style={item.colorStyle}></span>
              <span class="legend-label">{item.name}</span>
            </span>
          </template>
        </div>
      </template>
    </template>

    <!-- No Data State -->
    <template lwc:else>
      <div
        class="slds-align_absolute-center slds-text-color_weak"
        style="height: 200px"
      >
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:trending"
            alternative-text="No data"
            size="large"
          ></lightning-icon>
          <p class="slds-m-top_small">No data available</p>
        </div>
      </div>
    </template>
  </div>
</template>
